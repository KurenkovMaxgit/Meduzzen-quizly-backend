name: Quizly CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:diff

      - name: Lint code
        run: npm run lint:check

      - name: Run TS type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build project
        run: npm run build
