name: Quizly CD

on:
  # workflow_run:
  #   workflows: ['Quizly CI']
  #   types: [completed]
  #   branches: [main]
  push:
    branches: ['**']

jobs:
  deploy:
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/quizly-backend:latest -f Dockerfile.prod .
          docker push $ECR_REGISTRY/quizly-backend:latest

      - name: Force ECS Service Update
        run: |
          aws ecs update-service --cluster QuizlyCluster --service QuizlyService --force-new-deployment
