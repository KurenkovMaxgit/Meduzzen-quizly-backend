name: quizly-test-db
services:
  postgres-test:
    image: postgres:18
    container_name: postgres_test_container
    env_file:
      - ./.env.test
    ports:
      - '${POSTGRES_PORT}:5432'
    tmpfs:
      - /var/lib/postgresql/data/pgdata
  redis-test:
    image: redis:alpine
    container_name: redis_test_container
    env_file:
      - ./.env.test
    ports:
      - '${REDIS_PORT}:6379'
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
